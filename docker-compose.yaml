services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports: 
      - "8000:8000"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - HOST_DB=db
      - PORT_DB=5432
  
  db:
    image: postgres:18
    volumes:
      - postgres_data_tg:/var/lib/postgresql
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${NAME_DB}
      - POSTGRES_USER=${USER_DB}
      - POSTGRES_PASSWORD=${PASSWORD_DB}
    networks:
      - backend
    ports: 
      - "9999:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB} -d ${NAME_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
networks:
  backend:

volumes:
  postgres_data_tg: